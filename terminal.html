<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dharmik@portfolio — terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #21222C;
      --bg2:     #191A21;
      --bg3:     #282A36;
      --line:    #44475A;
      --fg:      #F8F8F2;
      --dim:     #6272A4;
      --red:     #FF5555;
      --orange:  #FFB86C;
      --yellow:  #F1FA8C;
      --green:   #50FA7B;
      --cyan:    #8BE9FD;
      --purple:  #BD93F9;
      --pink:    #FF79C6;
      --font:    'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg2);
      font-family: var(--font);
      color: var(--fg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Canvas ── */
    #bgCanvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    /* ── Scene ── */
    .scene {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }

    /* ── Terminal wrapper (3D tilt target) ── */
    .term-wrap {
      width: min(880px, 94vw);
      will-change: transform;
    }

    /* ── Terminal window ── */
    .terminal {
      background: var(--bg3);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(189,147,249,.3);
      box-shadow:
        0 0 0 1px rgba(189,147,249,.06),
        0 4px 16px rgba(0,0,0,.5),
        0 16px 48px rgba(0,0,0,.5),
        0 0 60px rgba(189,147,249,.10),
        0 0 120px rgba(139,233,253,.05),
        inset 0 1px 0 rgba(255,255,255,.04);
      position: relative;
    }

    /* CRT scan lines */
    .terminal::after {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.025) 2px,
        rgba(0,0,0,.025) 4px
      );
      pointer-events: none;
      border-radius: 14px;
      z-index: 20;
    }

    /* Purple glow line at top */
    .terminal::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
      opacity: .5;
      z-index: 21;
    }

    /* ── Chrome bar ── */
    .term-chrome {
      background: var(--bg2);
      height: 42px;
      display: flex; align-items: center;
      padding: 0 1rem;
      gap: .85rem;
      border-bottom: 1px solid var(--line);
      user-select: none;
      flex-shrink: 0;
    }

    .tc-dots { display: flex; gap: 7px; align-items: center; flex-shrink: 0; }
    .tc-dot {
      width: 12px; height: 12px; border-radius: 50%;
      cursor: pointer;
      transition: filter .15s, transform .15s;
      position: relative;
    }
    .tc-dot:hover { filter: brightness(1.25); transform: scale(1.15); }
    .td-red    { background: #FF5555; box-shadow: 0 0 8px #FF555588; }
    .td-yellow { background: #F1FA8C; box-shadow: 0 0 8px #F1FA8C88; }
    .td-green  { background: #50FA7B; box-shadow: 0 0 8px #50FA7B88; }

    .tc-title {
      flex: 1; text-align: center;
      font-size: .68rem; color: var(--dim);
      letter-spacing: .04em; white-space: nowrap; overflow: hidden;
    }

    .tc-back {
      font-size: .65rem; color: var(--dim);
      text-decoration: none; letter-spacing: .04em;
      padding: .25rem .65rem;
      border: 1px solid var(--line); border-radius: 5px;
      flex-shrink: 0;
      transition: color .2s, border-color .2s, background .2s;
    }
    .tc-back:hover { color: var(--purple); border-color: var(--purple); background: rgba(189,147,249,.08); }

    /* ── Body ── */
    .term-body {
      height: clamp(340px, 60vh, 580px);
      overflow-y: auto;
      padding: 1.1rem 1.5rem;
      font-size: .8rem;
      line-height: 1.7;
      position: relative;
      z-index: 1;
    }
    .term-body::-webkit-scrollbar { width: 3px; }
    .term-body::-webkit-scrollbar-track { background: transparent; }
    .term-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    /* ── Output lines ── */
    .out-line { margin: 0; white-space: pre-wrap; word-break: break-word; min-height: 1.4em; }
    .out-blank { height: .55em; }
    .out-cmd { display: flex; gap: .4rem; align-items: baseline; flex-wrap: nowrap; }
    .out-prompt { color: var(--green); white-space: nowrap; flex-shrink: 0; }
    .out-cmd-text { color: var(--cyan); }

    /* ASCII art */
    .ascii { color: var(--purple); font-size: .7rem; line-height: 1.22; letter-spacing: .01em; }

    /* ── Input row ── */
    .term-input-row {
      display: flex; align-items: center;
      padding: .7rem 1.5rem;
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,.18);
      gap: 0; flex-shrink: 0;
      position: relative; z-index: 2;
    }
    .t-prompt {
      color: var(--green); font-size: .8rem;
      white-space: nowrap; flex-shrink: 0; user-select: none;
    }
    #cmdInput {
      flex: 1;
      background: transparent; border: none; outline: none;
      font-family: var(--font); font-size: .8rem;
      color: var(--cyan); caret-color: transparent;
      padding: 0; min-width: 0;
    }
    .t-cursor {
      display: inline-block;
      width: 7px; height: 13px;
      background: var(--purple);
      animation: blink .95s step-end infinite;
      border-radius: 1px; flex-shrink: 0;
      box-shadow: 0 0 6px var(--purple);
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Color helpers ── */
    .cp  { color: var(--purple); }
    .cc  { color: var(--cyan); }
    .cg  { color: var(--green); }
    .cy  { color: var(--yellow); }
    .cr  { color: var(--red); }
    .co  { color: var(--orange); }
    .cpk { color: var(--pink); }
    .cd  { color: var(--dim); }
    .cf  { color: var(--fg); }
    .b   { font-weight: 700; }
    .dim { opacity: .5; }
    a.tlink { color: var(--cyan); text-decoration: none; }
    a.tlink:hover { text-decoration: underline; color: var(--purple); }

    /* Progress bar */
    .pbar-track {
      display: inline-block;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
      vertical-align: middle;
    }
    .pbar-fill { display: block; height: 100%; border-radius: 2px; }

    /* Help table */
    .htbl { border-collapse: collapse; }
    .htbl td { padding: .12rem 1.2rem .12rem 0; vertical-align: top; }
    .htbl td:first-child { color: var(--cyan); min-width: 140px; }
    .htbl td:last-child  { color: var(--dim);  }

    /* ── Hint bar ── */
    .hint-bar {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      font-size: .62rem; color: var(--dim);
      letter-spacing: .05em;
      background: rgba(25,26,33,.92);
      padding: .35rem 1rem; border-radius: 20px;
      border: 1px solid var(--line);
      white-space: nowrap;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      animation: hintIn .5s 5s ease both;
    }
    @keyframes hintIn { from{opacity:0;transform:translateX(-50%) translateY(6px)} to{opacity:.9;transform:translateX(-50%) translateY(0)} }

    kbd {
      display: inline-block;
      background: var(--line); color: var(--fg);
      border-radius: 3px; padding: 0 .35em; font-size: .85em;
    }

    /* Matrix canvas overlay */
    #matrixCanvas {
      display: none;
      position: absolute; inset: 0;
      z-index: 15; pointer-events: none;
      border-radius: 14px;
    }

    /* Glitch flicker for hack */
    @keyframes glitch {
      0%,100%{transform:none;filter:none}
      20%{transform:translate(-2px,1px) skewX(.5deg);filter:hue-rotate(90deg)}
      40%{transform:translate(2px,-1px) skewX(-.5deg);filter:hue-rotate(-90deg)}
      60%{transform:translate(-1px,2px);filter:none}
    }
    .glitching { animation: glitch .15s 4; }

    /* Mobile */
    @media(max-width:600px) {
      .ascii { font-size: .48rem; }
      .term-body { font-size: .72rem; }
      #cmdInput { font-size: .72rem; }
      .t-prompt { font-size: .72rem; }
      .hint-bar { display: none; }
    }
  </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="scene" id="scene">
  <div class="term-wrap" id="termWrap">
    <div class="terminal" id="terminal">
      <canvas id="matrixCanvas"></canvas>

      <div class="term-chrome">
        <div class="tc-dots">
          <span class="tc-dot td-red"    id="btnClose"  title="Close"></span>
          <span class="tc-dot td-yellow" id="btnMin"    title="Minimize"></span>
          <span class="tc-dot td-green"  id="btnMax"    title="Maximize"></span>
        </div>
        <div class="tc-title" id="tcTitle">dharmik@portfolio: ~/terminal — zsh</div>
        <a href="index.html" class="tc-back">← portfolio</a>
      </div>

      <div class="term-body" id="termBody"></div>

      <div class="term-input-row">
        <span class="t-prompt" id="promptLabel">dharmik@portfolio:~$ </span>
        <input type="text" id="cmdInput" autocomplete="off" autocorrect="off"
               autocapitalize="off" spellcheck="false">
        <span class="t-cursor"></span>
      </div>
    </div>
  </div>
</div>

<div class="hint-bar">
  <kbd>↑</kbd><kbd>↓</kbd> history &nbsp;·&nbsp;
  <kbd>Tab</kbd> complete &nbsp;·&nbsp;
  type <span class="cp">help</span> for commands
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   THREE.JS CINEMATIC UNIVERSE — terminal.html
   Holographic sphere · Orbital rings · Nebula · Crystals
═══════════════════════════════════════════════════════════ */
try { (function initThree() { // eslint-disable-line
  const canvas   = document.getElementById('bgCanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
  camera.position.z = 6;

  /* ── Glow sprite factory ── */
  function sprite(r, g, b, a = 1) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const grd = ctx.createRadialGradient(32,32,0,32,32,32);
    grd.addColorStop(0,    `rgba(${r},${g},${b},${a})`);
    grd.addColorStop(0.35, `rgba(${r},${g},${b},${a*.7})`);
    grd.addColorStop(1,    `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = grd; ctx.fillRect(0,0,64,64);
    return new THREE.CanvasTexture(c);
  }
  const SPR_WHITE = sprite(200,220,255);
  const SPR_CYAN  = sprite(100,255,218);
  const SPR_PURPLE= sprite(189,147,249);

  /* ══ 1. STAR FIELD ══ */
  {
    const N = 5000;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i*3]   = (Math.random()-.5)*180;
      pos[i*3+1] = (Math.random()-.5)*180;
      pos[i*3+2] = (Math.random()-.5)*100;
      const r = Math.random();
      if      (r < .55) { col[i*3]=.78; col[i*3+1]=.88; col[i*3+2]=1.0; }
      else if (r < .80) { col[i*3]=.74; col[i*3+1]=.58; col[i*3+2]=.98; }
      else              { col[i*3]=.39; col[i*3+1]=1.0;  col[i*3+2]=.85; }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',    new THREE.BufferAttribute(col,3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      size:.12, map:SPR_WHITE, vertexColors:true,
      transparent:true, depthWrite:false,
      blending:THREE.AdditiveBlending,
    })));
  }

  /* ══ 2. HOLOGRAPHIC SPHERE ══ */
  let holoMesh, holoU;
  {
    holoU = {
      uTime:      { value: 0 },
      uColorEdge: { value: new THREE.Color(0x8BE9FD) },  // Dracula cyan
      uColorCore: { value: new THREE.Color(0x21222C) },  // Dracula bg
    };
    holoMesh = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 80, 80),
      new THREE.ShaderMaterial({
        uniforms: holoU,
        vertexShader: `
          uniform float uTime;
          varying vec3 vNormal;
          varying vec3 vWorldPos;
          varying vec2 vUv;
          void main(){
            vNormal   = normalize(normalMatrix * normal);
            vUv       = uv;
            vec3 p    = position;
            float d   = sin(p.x*6.0+uTime*1.6)*cos(p.y*6.0+uTime*1.0)*cos(p.z*5.0)*0.06;
            p        += normal*d;
            vec4 wp   = modelMatrix*vec4(p,1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform vec3  uColorEdge;
          uniform vec3  uColorCore;
          varying vec3  vNormal;
          varying vec3  vWorldPos;
          varying vec2  vUv;
          void main(){
            vec3 view  = normalize(cameraPosition - vWorldPos);
            float fres = pow(1.0 - abs(dot(vNormal, view)), 2.8);
            float scan = step(0.48, fract(vUv.y*55.0 - uTime*1.0))*0.22;
            float gx   = step(0.94, fract(vUv.x*22.0));
            float gy   = step(0.94, fract(vUv.y*22.0));
            float grid = clamp(gx+gy,0.0,1.0)*0.2;
            float pls  = 0.55+0.45*sin(uTime*1.4+vUv.y*8.0);
            vec3 col   = mix(uColorCore, uColorEdge, fres*pls*1.4+scan+grid);
            float alp  = fres*0.82+scan*0.9+grid*0.8+0.04;
            gl_FragColor = vec4(col, clamp(alp,0.0,1.0));
          }
        `,
        transparent:true, blending:THREE.AdditiveBlending,
        depthWrite:false, side:THREE.FrontSide,
      })
    );
    holoMesh.position.set(3.8, 0.4, -2);
    scene.add(holoMesh);
  }

  /* ══ 3. ORBITAL RINGS + TRAVELING DOTS ══ */
  const orbDots = [];
  {
    const RING_CFG = [
      { r:3.2, tX: Math.PI*.38,  tZ:0,           nPts:8,  spd: 1.1 },
      { r:3.9, tX:-Math.PI*.22,  tZ:Math.PI*.18,  nPts:6,  spd:-0.7 },
      { r:4.6, tX: Math.PI*.12,  tZ:Math.PI*.44,  nPts:10, spd: 0.5 },
    ];
    const GROUP = new THREE.Group();
    GROUP.position.set(3.8, 0.4, -2);
    scene.add(GROUP);

    RING_CFG.forEach(cfg => {
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i/128)*Math.PI*2;
        pts.push(new THREE.Vector3(Math.cos(a)*cfg.r, 0, Math.sin(a)*cfg.r));
      }
      const ring = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color:0x8BE9FD, transparent:true, opacity:.14, blending:THREE.AdditiveBlending })
      );
      ring.rotation.x = cfg.tX; ring.rotation.z = cfg.tZ;
      GROUP.add(ring);

      for (let i = 0; i < cfg.nPts; i++) {
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(.07, 6, 6),
          new THREE.MeshBasicMaterial({ color:0x8BE9FD, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false })
        );
        dot.userData = { angle:(i/cfg.nPts)*Math.PI*2, r:cfg.r, spd:cfg.spd, tX:cfg.tX, tZ:cfg.tZ };
        scene.add(dot);
        orbDots.push(dot);
      }
    });
  }

  function updateOrbital() {
    orbDots.forEach(dot => {
      const d = dot.userData;
      d.angle += d.spd * .012;
      const lx = Math.cos(d.angle)*d.r;
      const lz = Math.sin(d.angle)*d.r;
      const cX = Math.cos(d.tX), sX = Math.sin(d.tX);
      const cZ = Math.cos(d.tZ), sZ = Math.sin(d.tZ);
      const y1 = -lz*sX, z1 = lz*cX;
      const x2 = lx*cZ - y1*sZ, y2 = lx*sZ + y1*cZ;
      dot.position.set(x2+3.8, y2+0.4, z1-2);
    });
  }

  /* ══ 4. NEBULA CLOUD (around sphere) ══ */
  {
    const N = 1600;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(N*3);
    for (let i = 0; i < N; i++) {
      const phi = Math.acos(2*Math.random()-1);
      const th  = Math.random()*Math.PI*2;
      const r   = 2.4 + Math.random()*2.2;
      pos[i*3]   = Math.sin(phi)*Math.cos(th)*r + 3.8;
      pos[i*3+1] = Math.sin(phi)*Math.sin(th)*r + 0.4;
      pos[i*3+2] = Math.cos(phi)*r - 2;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
      size:.07, map:SPR_CYAN, transparent:true,
      depthWrite:false, blending:THREE.AdditiveBlending, opacity:.45,
    })));
  }

  /* ══ 5. FLOATING CRYSTALS (scattered around terminal) ══ */
  const crystals = [];
  {
    const CFGS = [
      { x:-6.5, y: 3.0, z:-3.5, s:.50, sp:.28, ph:0.0 },
      { x: 7.2, y: 2.5, z:-3.0, s:.42, sp:.35, ph:1.1 },
      { x:-7.0, y:-2.8, z:-4.0, s:.58, sp:.22, ph:2.2 },
      { x: 6.8, y:-2.5, z:-3.5, s:.38, sp:.40, ph:3.3 },
      { x:-5.5, y: 0.8, z:-5.0, s:.48, sp:.18, ph:0.7 },
      { x: 5.8, y:-1.2, z:-4.5, s:.44, sp:.30, ph:1.9 },
      { x:-4.0, y: 4.2, z:-6.0, s:.35, sp:.38, ph:2.8 },
      { x: 4.5, y:-3.8, z:-5.5, s:.52, sp:.25, ph:0.4 },
    ];
    CFGS.forEach((c, i) => {
      const geo = i%3===0
        ? new THREE.OctahedronGeometry(c.s, 0)
        : i%3===1
          ? new THREE.IcosahedronGeometry(c.s, 1)
          : new THREE.TetrahedronGeometry(c.s, 0);
      const mat = new THREE.MeshStandardMaterial({
        color:0x282A36, emissive:0xBD93F9, emissiveIntensity:.4,
        metalness:.95, roughness:.05, transparent:true, opacity:.88,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(c.x, c.y, c.z);
      mesh.userData = { baseY:c.y, sp:c.sp, phase:c.ph };
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color:0xBD93F9, transparent:true, opacity:.55, blending:THREE.AdditiveBlending })
      );
      mesh.add(edges);
      scene.add(mesh);
      crystals.push(mesh);
    });

    // Ambient light for crystal reflections
    scene.add(new THREE.AmbientLight(0xBD93F9, 0.4));
    const pLight = new THREE.PointLight(0x8BE9FD, 1.2, 20);
    pLight.position.set(3.8, 0.4, 2);
    scene.add(pLight);
  }

  /* ══ 6. SHOOTING STAR ══ */
  let shootX=0, shootY=0, shootDX=0, shootDY=0, shootLife=0;
  const shootGeo = new THREE.BufferGeometry();
  const shootPos = new Float32Array(6);
  shootGeo.setAttribute('position', new THREE.BufferAttribute(shootPos,3));
  const shootMat = new THREE.LineBasicMaterial({
    color:0xffffff, transparent:true, opacity:0,
    blending:THREE.AdditiveBlending,
  });
  scene.add(new THREE.Line(shootGeo, shootMat));
  let shootTimer = 0;
  function spawnShoot() {
    shootX  = (Math.random()-.5)*40;
    shootY  = 12 + Math.random()*8;
    shootDX = (Math.random()-.5)*.5;
    shootDY = -(0.22 + Math.random()*.22);
    shootLife = 60 + Math.random()*40;
  }

  /* Mouse parallax */
  let mxT=0, myT=0, mxC=0, myC=0;
  window.addEventListener('mousemove', e => {
    mxT = (e.clientX/innerWidth  - .5)*2;
    myT = (e.clientY/innerHeight - .5)*2;
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  let clock = 0;
  function animate() {
    requestAnimationFrame(animate);
    clock += 0.0005;

    /* Holographic sphere */
    holoU.uTime.value = clock * 120;
    holoMesh.rotation.y = clock * 0.28;
    holoMesh.rotation.x = clock * 0.09;

    /* Orbital dots */
    updateOrbital();

    /* Crystals float */
    crystals.forEach(c => {
      const d = c.userData;
      c.position.y = d.baseY + Math.sin(clock*120*d.sp + d.phase)*0.18;
      c.rotation.x += 0.006 * d.sp;
      c.rotation.y += 0.009 * d.sp;
    });

    /* Camera slow drift */
    mxC += (mxT - mxC) * 0.02;
    myC += (myT - myC) * 0.02;
    camera.position.x += (mxC*.6 - camera.position.x)*.035;
    camera.position.y += (-myC*.35 - camera.position.y)*.035;
    camera.lookAt(0, 0, 0);

    /* Shooting star */
    shootTimer++;
    if (shootTimer > 200 + Math.random()*200) { spawnShoot(); shootTimer = 0; }
    if (shootLife > 0) {
      shootLife--;
      shootX += shootDX; shootY += shootDY;
      const tail = 3.5;
      shootPos[0]=shootX;          shootPos[1]=shootY;          shootPos[2]=0;
      shootPos[3]=shootX-shootDX*tail; shootPos[4]=shootY-shootDY*tail; shootPos[5]=0;
      shootGeo.attributes.position.needsUpdate = true;
      shootMat.opacity = Math.min(shootLife/20, 1)*0.75;
    } else {
      shootMat.opacity = 0;
    }

    renderer.render(scene, camera);
  }
  animate();
})();
} catch(e) { console.warn('Three.js background failed:', e); }

   3D TILT + FLOAT
═══════════════════════════════════════════════════════════ */
try { (function initTilt() {
  const wrap = document.getElementById('termWrap');
  let tX = 0, tY = 0, cX = 0, cY = 0, floatT = 0;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function loop() {
    floatT += 0.012;
    const floatY = Math.sin(floatT) * 7;
    cX = lerp(cX, tX, 0.065);
    cY = lerp(cY, tY, 0.065);
    wrap.style.transform =
      `rotateX(${cY}deg) rotateY(${cX}deg) translateY(${floatY}px)`;
    requestAnimationFrame(loop);
  }
  loop();

  window.addEventListener('mousemove', e => {
    const cx = innerWidth / 2, cy = innerHeight / 2;
    tX =  ((e.clientX - cx) / cx) * 7;
    tY = -((e.clientY - cy) / cy) * 5;
  });
  window.addEventListener('mouseleave', () => { tX = 0; tY = 0; });
})();
} catch(e) { console.warn('Tilt failed:', e); }

/* ── Utilities ── */
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function prompt() {
  return `dharmik@portfolio:${currentDir}$ `;

function scrollBot() { body.scrollTop = body.scrollHeight; }

function line(html = '', extra = '') {
  const p = document.createElement('p');
  p.className = 'out-line' + (extra ? ' ' + extra : '');
  p.innerHTML = html;
  body.appendChild(p);
  scrollBot();
  return p;
}

function blank() {
  const p = document.createElement('p');
  p.className = 'out-blank';
  body.appendChild(p);
  scrollBot();
}

function cmdLine(raw) {
  const p = document.createElement('p');
  p.className = 'out-line out-cmd';
  p.innerHTML =
    `<span class="out-prompt">${esc(prompt())}</span>` +
    `<span class="out-cmd-text">${esc(raw)}</span>`;
  body.appendChild(p);
  scrollBot();
}

function lock()   { locked = true;  inputEl.disabled = true; }
function unlock() { locked = false; inputEl.disabled = false; inputEl.focus(); }

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function typewrite(el, text, speed = 38) {
  return new Promise(res => {
    let i = 0;
    const iv = setInterval(() => {
      el.textContent += text[i++];
      scrollBot();
      if (i >= text.length) { clearInterval(iv); res(); }
    }, speed);
  });
}

/* Bar helper: filled/empty blocks */
function bar(pct, width = 20, colorClass = 'cp') {
  const f = Math.round(pct / 100 * width);
  const filled = '█'.repeat(f);
  const empty  = '░'.repeat(width - f);
  return `<span class="${colorClass}">${filled}</span><span class="dim">${empty}</span>`;
}

/* ── Matrix Easter Egg ── */
async function cmdMatrix() {
  const matCanvas = document.getElementById('matrixCanvas');
  matCanvas.style.display = 'block';
  matCanvas.width  = body.offsetWidth  || 840;
  matCanvas.height = body.offsetHeight || 520;
  const ctx = matCanvas.getContext('2d');

  matrixActive = true;
  lock();
  blank();
  line(`<span class="cg">Initializing Matrix protocol...</span>`);
  await sleep(500);

  const cols  = Math.floor(matCanvas.width / 14);
  const drops = Array.from({ length: cols }, () => Math.random() * -50);
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモ01アBCDEF';

  let frame = 0;
  const iv = setInterval(() => {
    ctx.fillStyle = 'rgba(25,26,33,0.14)';
    ctx.fillRect(0, 0, matCanvas.width, matCanvas.height);

    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      const x  = i * 14;
      const y  = drops[i] * 14;

      // Leading char — bright white
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#50FA7B';
      ctx.shadowBlur  = 8;
      ctx.font = 'bold 13px "JetBrains Mono", monospace';
      ctx.fillText(ch, x, y);

      // Trail chars — green
      ctx.fillStyle  = `rgba(80,250,123,${0.3 + Math.random() * 0.5})`;
      ctx.shadowBlur = 0;
      ctx.font = '12px "JetBrains Mono", monospace';
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y - 14);
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y - 28);

      if (drops[i] * 14 > matCanvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i] += 0.5 + Math.random() * 0.4;
    }

    frame++;
    if (frame > 200) {
      clearInterval(iv);
      ctx.clearRect(0, 0, matCanvas.width, matCanvas.height);
      matCanvas.style.display = 'none';
      blank();
      line(`<span class="cg b">Wake up, Dharmik... The Matrix has you.</span>`);
      line(`<span class="cd">// Type 'clear' to continue</span>`);
      blank();
      matrixActive = false;
      unlock();
    }
  }, 45);
}

  clear: cmdClear, cls: cmdClear,
};

/* ── Run command ── */
async function runCommand(raw) {
  const parts = raw.trim().split(/\s+/);
  const cmd   = parts[0].toLowerCase();
  const args  = parts.slice(1);

  cmdLine(raw);
  if (!cmd) return;

  // Special multi-word commands
  const twoWord = `${cmd} ${(args[0]||'').toLowerCase()}`;
  const fn = CMDS[twoWord] || CMDS[cmd];

  if (fn) {
    await fn(args);
  } else {
    blank();
    line(`<span class="cr">${esc(cmd)}: command not found</span>  <span class="cd">— type 'help' for commands</span>`);
    blank();
  }
}

/* ── Input events ── */
inputEl.addEventListener('keydown', async e => {
  if (locked) return;

  if (e.key === 'Enter') {
    const val = inputEl.value;
    inputEl.value = '';
    histIdx = -1;
    if (val.trim()) cmdHistory.unshift(val.trim());
    await runCommand(val);
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < cmdHistory.length - 1) histIdx++;
    inputEl.value = cmdHistory[histIdx] || '';
    setTimeout(() => { inputEl.selectionStart = inputEl.selectionEnd = inputEl.value.length; }, 0);
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) histIdx--;
    else { histIdx = -1; inputEl.value = ''; return; }
    inputEl.value = cmdHistory[histIdx] || '';
    return;
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const val = inputEl.value.toLowerCase().trim();
    if (!val) return;
    const match = Object.keys(CMDS).find(c => c.startsWith(val) && c !== val && !c.includes(' '));
    if (match) inputEl.value = match;
    return;
  }
  if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    cmdClear();
    return;
  }
  if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    blank();
    line(`<span class="cr">^C</span>`);
    blank();
    inputEl.value = '';
    return;
  }
});
